name: dont-get-sued-tests
on:
  push:
    paths:
      - 'packages/dont-get-sued/**'
      - 'skills/dont-get-sued/**'
      - '.github/workflows/dont-get-sued-tests.yml'
  pull_request:
    paths:
      - 'packages/dont-get-sued/**'
      - 'skills/dont-get-sued/**'
      - '.github/workflows/dont-get-sued-tests.yml'
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix packages/dont-get-sued test
